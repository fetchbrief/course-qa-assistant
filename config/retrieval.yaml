# 检索配置 —— 这些参数原来写死在 app.py 里，现在搬到这里
#
# 为什么单独一个文件：
#   model.yaml 管"用哪个模型"，
#   generation.yaml 管"模型怎么写答案"，
#   retrieval.yaml 管"找到什么资料"。
#   三件事不一样，放一起会乱。

sim_threshold: 0.45      # 余弦低于这条线 → 不收 → 上层拒答

# 相对阈值：只有分数 ≥ 最高分 × 这个比例，才算「同一条证据」。
# 例：最高 0.757，比例 0.85 → 低于 0.643 的一律丢掉。
# 目的：防止 top_k=3 硬凑数，把明显不相关的文档塞给模型。
source_rel_ratio: 0.85

chunk_max: 400           # 每段最多多少字
chunk_overlap: 80        # 相邻两段重叠多少字（约 20%，避免一刀切断语义）
top_k_default: 3         # 默认取前几条

# ---- 缓存 ----
# 压测时同一批问题会被反复问。缓存能把"重复问题"的成本从「一次模型调用」降到「一次字典查询」。
# TTL 到期自动失效，避免政策改了还在用旧答案。
cache_ttl_s: 300         # 缓存存活多少秒
cache_max: 256           # 最多存多少条（超了淘汰最久没用的）
